name: CI

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run tokens
      - name: Check tokens.css is up to date
        run: |
          git diff --exit-code src/styles/tokens.css || {
            echo "::error file=src/styles/tokens.css::tokens.css is out of date with tokens/. Run 'npm run tokens' and commit the result."
            exit 1
          }
      - run: npm run lint:css
      - run: npm run check:prototypes

      - uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}